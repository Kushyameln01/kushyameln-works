<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube の X Player Card | Kushyameln Works</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <nav><a href="../github/">GitHub・ツール</a></nav>
  <main>
    <h1>YouTube の X Player Card</h1>
    <form id="setup">
      <label for="video">YouTube の動画URLまたは動画ID</label>
      <div class="row">
        <input id="video" type="text" placeholder="https://youtu.be/…" autocomplete="off" spellcheck="false" required>
        <button type="submit">カードを作成</button>
      </div>
    </form>
    <a href="?v=2p0QxvP06H8">VR180のサンプルを試す</a>
    <p id="message" role="status"></p>
    <section id="result" hidden>
      <h2 id="video-title"></h2>
      <label for="share-url">Xに貼るカードURL（YouTube）</label>
      <div class="row">
        <input id="share-url" type="text" readonly>
        <button id="copy" type="button">コピー</button>
        <a id="post" target="_blank" rel="noopener">Xで投稿</a>
      </div>
      <p role="status" id="feedback"></p>
      <div id="preview"></div>
      <button id="save" type="button">カードHTMLを保存</button>
    </section>
    <noscript>カードを作成するにはJavaScriptを有効にしてください。</noscript>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
