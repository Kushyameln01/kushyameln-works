<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoRA — Kushyameln Works</title>
<style>
:root{font-family:system-ui,sans-serif;color:#202733;background:#f6f7f9}body{max-width:780px;margin:56px auto;padding:0 24px}h1{font-size:1.7rem}.lora-fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}.lora-fields label{display:grid;gap:8px}.lora-fields label:first-child{grid-column:1/-1}input,select,button{font:inherit;padding:10px;border:1px solid #b9c2cf;border-radius:6px;background:white}input[type=file]{max-width:100%;box-sizing:border-box}.lora-actions{display:flex;flex-wrap:wrap;gap:10px}button:not(:disabled){cursor:pointer}button[data-action=apply]:not(:disabled){background:#204f98;color:white}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:white;border-radius:8px}p{line-height:1.6}@media(max-width:520px){.lora-fields{grid-template-columns:1fr}}
</style>
<h1>LoRA</h1>
<main id="lora"></main>
<script type="module">
import {mountLoraPanel} from '../shared/inference/lora/panel.mjs';
window.loraPanel=mountLoraPanel(document.querySelector('#lora'));
</script>
</html>
