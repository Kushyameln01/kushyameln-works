name: VR180 private bounded artifact transfer
description: Qualifies small public synthetic transport through a fixed official SDK. No media or capacity claim.
inputs:
  source-manifest:
    description: Absolute source manifest created by the fixed probe under RUNNER_TEMP.
    required: true
  output-directory:
    description: New owned directory under RUNNER_TEMP for bounded receipts and temporary chunks.
    required: true
runs:
  using: node20
  main: main.cjs
