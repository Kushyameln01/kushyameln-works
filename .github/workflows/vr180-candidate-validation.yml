name: VR180 candidate validation

on:
  push:
    branches: [codex/vr180-plan-*]
    paths:
      - .github/workflows/vr180-candidate-validation.yml
      - tools/vr180/cloud-validate.py
      - tools/vr180/compare-phases.py
      - tools/vr180/rebuild-vendor-core.mjs
      - tools/vr180/probe-index-store.py
      - development/vr180/index-prototype/**
      - tools/vr180/build-output-index.mjs
      - tools/vr180/probe-output-index.py
      - tools/vr180/probe-indexed-conversion.py
      - tools/vr180/probe-public-origin.py
      - tools/vr180/probe-index-owner.py
      - tools/vr180/probe-persistent-storage.py
      - tools/vr180/probe-segmented-transfer.py
      - tools/vr180/emit-segmented-transfer-evidence.py
      - development/vr180/artifact-transfer-action/**
      - development/vr180/artifact-receive-action/**
      - tools/vr180/receive-in-actions.py
      - tools/vr180/receive-segmented-artifact.py
      - tools/vr180/record-ffmpeg-toolchain.py
      - development/vr180/p5-calibration-prototype/**
      - tools/vr180/build-input-index.mjs
      - development/vr180/input-index-prototype/**
      - development/vr180/indexed-transform-prototype/**
      - development/vr180/indexed-conversion-fixtures/**
      - development/vr180/output-index-prototype/**
      - tools/vr180/probe-artifact-transfer.py
      - tools/vr180/package-build-toolchain.py
      - development/vr180/build-inputs/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segmented-artifact-probe:
    if: >-
      github.repository == 'Kushyameln01/kushyameln-works' &&
      github.event.repository.private == false &&
      startsWith(github.ref, 'refs/heads/codex/vr180-plan-') &&
      (contains(github.event.head_commit.message, '[vr180-segmented-service]') ||
      contains(github.event.head_commit.message, '[vr180-segmented-128]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    outputs:
      receipt-json: ${{ steps.transfer.outputs.receipt-json }}
      profile: ${{ env.VR180_SEGMENT_PROFILE }}
    env:
      DO_NOT_TRACK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      VR180_SEGMENT_PROFILE: ${{ contains(github.event.head_commit.message, '[vr180-segmented-128]') && 'single-128mib' || 'service-8mib' }}
      VR180_CLOUD_RECEIVER_PROBE: ${{ contains(github.event.head_commit.message, '[vr180-cloud-receiver]') }}
    steps:
      - name: Check out the exact private transport candidate
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the fixed official artifact SDK dependency closure
        timeout-minutes: 3
        working-directory: development/vr180/artifact-transfer-action
        run: |
          node --version
          npm --version
          npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Generate and reread actual bounded public synthetic bytes
        timeout-minutes: 2
        run: |
          if [ "$VR180_SEGMENT_PROFILE" = 'single-128mib' ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('development/vr180/evidence/2026-10-17-segmented-service.json').read_text())
          assert r['status']=='PASS_FULL_RECOVERY' and r['workflowRun']==39041763123
          assert r['artifactCount']==17 and r['partCount']==16 and r['recovery']['status']=='PASS'
          assert sum(f['independentGeneratorComparedBytes'] for f in r['recovery']['wholeFiles'])==125829120
          import os
          if os.environ['VR180_CLOUD_RECEIVER_PROBE']=='true':
              r=json.loads(Path('development/vr180/evidence/2026-10-17-actions-receiver-service.json').read_text())
              assert r['status']=='PASS_SEPARATE_ACTIONS_BYTES' and r['runId']==39044433711
              assert r['independentReview']['status']=='PASS'
              v=r['receiverRecords']['run.json']
              assert v['recoveredBytes']==v['independentComparedBytes']==125829120
              assert v['downloadArtifacts']==17 and v['dataArtifacts']==16
          PY
          fi
          python3 tools/vr180/probe-segmented-transfer.py \
          --profile "$VR180_SEGMENT_PROFILE" \
          --output-directory "$RUNNER_TEMP/vr180-segment-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Upload one part at a time through the official action runtime
        id: transfer
        timeout-minutes: 11
        uses: ./development/vr180/artifact-transfer-action
        with:
          source-manifest: ${{ runner.temp }}/vr180-segment-source-${{ github.run_id }}-${{ github.run_attempt }}/source-manifest.json
          output-directory: ${{ runner.temp }}/vr180-segment-upload-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Return bounded protocol records without credentials or raw parts
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 1
        run: >-
          python3 tools/vr180/emit-segmented-transfer-evidence.py
          --source "$RUNNER_TEMP/vr180-segment-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --upload "$RUNNER_TEMP/vr180-segment-upload-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --output "$RUNNER_TEMP/vr180-segment-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  segmented-artifact-receiver:
    needs: segmented-artifact-probe
    if: >-
      needs.segmented-artifact-probe.result == 'success' &&
      contains(github.event.head_commit.message, '[vr180-cloud-receiver]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DO_NOT_TRACK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the same exact receiver candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the same fixed artifact SDK dependency closure
        timeout-minutes: 3
        working-directory: development/vr180/artifact-transfer-action
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Recover all actual bytes on an independent fresh runner
        timeout-minutes: 21
        uses: ./development/vr180/artifact-receive-action
        with:
          receipt-json: ${{ needs.segmented-artifact-probe.outputs.receipt-json }}
          profile: ${{ needs.segmented-artifact-probe.outputs.profile }}

  persistent-storage-probe:
    if: >-
      github.repository == 'Kushyameln01/kushyameln-works' &&
      github.event.repository.private == false &&
      startsWith(github.ref, 'refs/heads/codex/vr180-plan-') &&
      contains(github.event.head_commit.message, '[vr180-persistent-storage]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_NOT_TRACK: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the exact private storage probe
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use pinned Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned browser driver
        id: dependencies
        timeout-minutes: 2
        run: |
          test -x /usr/bin/google-chrome
          python3 -m pip install --no-cache-dir playwright==1.62.0
      - name: Write, close, restart and independently compare an owned 16 MiB witness
        timeout-minutes: 5
        env:
          VR180_DEPENDENCIES_READY: ${{ steps.dependencies.outcome == 'success' }}
        run: >-
          python3 tools/vr180/probe-persistent-storage.py
          --output "$RUNNER_TEMP/vr180-persistent-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  p5-short-calibration:
    if: >-
      github.repository == 'Kushyameln01/kushyameln-works' &&
      github.event.repository.private == false &&
      startsWith(github.ref, 'refs/heads/codex/vr180-plan-') &&
      (contains(github.event.head_commit.message, '[vr180-p5-calibrate-32]') ||
      contains(github.event.head_commit.message, '[vr180-p5-calibrate-48]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 21
    env:
      DO_NOT_TRACK: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      VR180_P5_CASE: ${{ contains(github.event.head_commit.message, '[vr180-p5-calibrate-48]') && '48-24' || '32-32' }}
    steps:
      - name: Check out the exact private calibration candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use the pinned Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned driver and independent oracle dependencies
        id: dependencies
        timeout-minutes: 4
        shell: bash
        run: |
          test -x /usr/bin/google-chrome
          python3 -m pip install --no-cache-dir playwright==1.62.0 numpy==2.3.3
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends 'ffmpeg=7:6.1.1-3ubuntu5'
          python3 tools/vr180/record-ffmpeg-toolchain.py --output "$RUNNER_TEMP/vr180-p5-oracle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Rebuild the fixed combined fork separately from the media deadline
        timeout-minutes: 2
        shell: bash
        run: |
          vr180_p5_prefix="$(mktemp -d "$RUNNER_TEMP/vr180-p5-esbuild.XXXXXX")"
          trap 'rm -rf "$vr180_p5_prefix"' EXIT
          cp development/vr180/build-inputs/toolchain/package.json "$vr180_p5_prefix/"
          cp development/vr180/build-inputs/toolchain/package-lock.json "$vr180_p5_prefix/"
          npm ci --prefix "$vr180_p5_prefix" --ignore-scripts --include=dev --include=optional --no-audit --no-fund
          node tools/vr180/build-input-index.mjs --combined --esbuild-dir "$vr180_p5_prefix/node_modules/esbuild" --output-dir "$RUNNER_TEMP/vr180-p5-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Calibrate bounded native media and emit complete metadata evidence
        id: calibration
        timeout-minutes: 11
        env:
          VR180_DEPENDENCIES_READY: ${{ steps.dependencies.outcome == 'success' }}
        run: >-
          python3 development/vr180/p5-calibration-prototype/probe-calibration.py
          --bundle "$RUNNER_TEMP/vr180-p5-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/mediabunny-input-output-index.mjs"
          --oracle-toolchain "$RUNNER_TEMP/vr180-p5-oracle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          --case "$VR180_P5_CASE"
          --output "$RUNNER_TEMP/vr180-p5-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Recover all bounded calibration media, including complete quality failures
        if: ${{ steps.calibration.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 2
        with:
          name: vr180-p5-${{ env.VR180_P5_CASE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vr180-p5-${{ github.run_id }}-${{ github.run_attempt }}/media/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Remove only this attempt's calibration media and build files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/vr180-p5-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/media" "$RUNNER_TEMP/vr180-p5-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -f "$RUNNER_TEMP/vr180-p5-oracle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"

  recover-fixed-build-toolchain:
    if: >-
      github.repository == 'Kushyameln01/kushyameln-works' &&
      github.event.repository.private == false &&
      startsWith(github.ref, 'refs/heads/codex/vr180-plan-') &&
      contains(github.event.head_commit.message, '[vr180-toolchain-recovery]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out the exact build tools
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Rebuild unchanged vendor and return only pinned build tooling
        timeout-minutes: 5
        shell: bash
        run: |
          vr180_tool_prefix="$(mktemp -d "$RUNNER_TEMP/vr180-toolchain.XXXXXX")"
          vr180_tool_result="$(mktemp -d "$RUNNER_TEMP/vr180-tool-recovery.XXXXXX")"
          trap 'rm -rf "$vr180_tool_prefix" "$vr180_tool_result"' EXIT
          cp development/vr180/build-inputs/toolchain/package.json "$vr180_tool_prefix/"
          cp development/vr180/build-inputs/toolchain/package-lock.json "$vr180_tool_prefix/"
          npm ci --prefix "$vr180_tool_prefix" --ignore-scripts --include=dev --include=optional --no-audit --no-fund
          node tools/vr180/rebuild-vendor-core.mjs --esbuild-dir "$vr180_tool_prefix/node_modules/esbuild" --output-dir "$vr180_tool_result/result"
          python3 tools/vr180/package-build-toolchain.py --prefix "$vr180_tool_prefix" --output "$vr180_tool_result/result"

  synthetic-browser-check:
    if: >-
      github.repository == 'Kushyameln01/kushyameln-works' &&
      github.event.repository.private == false &&
      startsWith(github.ref, 'refs/heads/codex/vr180-plan-') &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[vr180-candidate-check]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the exact candidate commit
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1, official tag resolved 2026-10-17
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Python 3.12 without dependency caching
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0, official tag resolved 2026-10-17
        timeout-minutes: 1
        with:
          python-version: '3.12'

      - name: Install only the pinned Python harness dependencies
        id: dependencies
        timeout-minutes: 1
        shell: bash
        run: |
          test -x /usr/bin/google-chrome
          python3 -m pip install --no-cache-dir playwright==1.62.0

      - name: Run sandboxed candidate trials and emit complete evidence to logs
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 12
        env:
          VR180_DEPENDENCIES_READY: ${{ steps.dependencies.outcome == 'success' }}
        shell: bash
        run: python3 tools/vr180/cloud-validate.py --candidate --suite small --file-output-probe --direct-output-probe --defer-independent-verification --output "$RUNNER_TEMP/vr180-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Record checkout failure without claiming a media test
        if: ${{ always() && steps.checkout.outcome != 'success' }}
        shell: bash
        run: |
          printf '%s\n' 'VR180_EVIDENCE_ERROR {"status":"BLOCKED","complete":false,"reason":"Checkout failed; harness unavailable","executedMediaTrials":0}'
          exit 1

  phase-comparison:
    if: >-
      github.repository == 'Kushyameln01/kushyameln-works' &&
      github.event.repository.private == false &&
      startsWith(github.ref, 'refs/heads/codex/vr180-plan-') &&
      contains(github.event.head_commit.message, '[vr180-phase-check]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use the pinned Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch the accepted P1 baseline and pinned harness dependency
        id: dependencies
        timeout-minutes: 2
        shell: bash
        run: |
          test -x /usr/bin/google-chrome
          git fetch --depth=1 origin 4a8cae149c75800e7cffa3da202b50d5a0b0d54a
          git worktree add --detach "$RUNNER_TEMP/vr180-p1-baseline" 4a8cae149c75800e7cffa3da202b50d5a0b0d54a
          python3 -m pip install --no-cache-dir playwright==1.62.0
      - name: Compare direct-save phases with complete small-output recovery
        timeout-minutes: 12
        env:
          VR180_DEPENDENCIES_READY: ${{ steps.dependencies.outcome == 'success' }}
        run: python3 tools/vr180/compare-phases.py --baseline "$RUNNER_TEMP/vr180-p1-baseline" --output "$RUNNER_TEMP/vr180-phases-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  index-store-probe:
    if: >-
      github.repository == 'Kushyameln01/kushyameln-works' &&
      github.event.repository.private == false &&
      startsWith(github.ref, 'refs/heads/codex/vr180-plan-') &&
      contains(github.event.head_commit.message, '[vr180-index-check]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DO_NOT_TRACK: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the exact private prototype candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use the pinned Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned browser driver
        id: dependencies
        timeout-minutes: 1
        run: |
          test -x /usr/bin/google-chrome
          python3 -m pip install --no-cache-dir playwright==1.62.0
      - name: Probe native IndexStore and recover every record
        timeout-minutes: 6
        env:
          VR180_DEPENDENCIES_READY: ${{ steps.dependencies.outcome == 'success' }}
        run: python3 tools/vr180/probe-index-store.py --output "$RUNNER_TEMP/vr180-index-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  output-index-build:
    if: >-
      github.repository == 'Kushyameln01/kushyameln-works' &&
      github.event.repository.private == false &&
      startsWith(github.ref, 'refs/heads/codex/vr180-plan-') &&
      contains(github.event.head_commit.message, '[vr180-output-index-build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out the exact private prototype
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build fixed-source fork and return the complete module
        timeout-minutes: 5
        shell: bash
        run: |
          vr180_build_prefix="$(mktemp -d "$RUNNER_TEMP/vr180-fork-esbuild.XXXXXX")"
          vr180_fork_parent="$(mktemp -d "$RUNNER_TEMP/vr180-fork.XXXXXX")"
          trap 'rm -rf "$vr180_build_prefix"' EXIT
          cp development/vr180/build-inputs/toolchain/package.json "$vr180_build_prefix/"
          cp development/vr180/build-inputs/toolchain/package-lock.json "$vr180_build_prefix/"
          npm ci --prefix "$vr180_build_prefix" --ignore-scripts --include=dev --include=optional --no-audit --no-fund
          export VR180_FORK_OUTPUT="$vr180_fork_parent/result"
          set +e
          node tools/vr180/build-output-index.mjs --esbuild-dir "$vr180_build_prefix/node_modules/esbuild" --output-dir "$VR180_FORK_OUTPUT"
          vr180_fork_status=$?
          set -e
          python3 - <<'PY'
          import importlib.util,json,os,subprocess
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('cloud','tools/vr180/cloud-validate.py')
          cloud=importlib.util.module_from_spec(spec);spec.loader.exec_module(cloud)
          out=Path(os.environ['VR180_FORK_OUTPUT'])
          fork=json.loads((out/'fork-build-result.json').read_text())
          run={'runId':os.environ['GITHUB_RUN_ID']+'-output-index-build-'+os.environ['GITHUB_RUN_ATTEMPT'],'checkoutCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'status':fork['status'],'scope':'Private fork compilation only; product integration and media verification not performed'}
          cloud.write(out/'run.json',run)
          if not cloud.emit_evidence(out,run):raise SystemExit(1)
          PY
          exit "$vr180_fork_status"

  output-index-native:
    if: >-
      github.repository == 'Kushyameln01/kushyameln-works' &&
      github.event.repository.private == false &&
      startsWith(github.ref, 'refs/heads/codex/vr180-plan-') &&
      contains(github.event.head_commit.message, '[vr180-output-index-native]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the exact private output candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use the pinned Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned browser driver
        id: dependencies
        timeout-minutes: 1
        run: |
          test -x /usr/bin/google-chrome
          python3 -m pip install --no-cache-dir playwright==1.62.0
      - name: Rebuild private fork and test native OPFS output
        timeout-minutes: 7
        env:
          VR180_DEPENDENCIES_READY: ${{ steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          vr180_native_prefix="$(mktemp -d "$RUNNER_TEMP/vr180-native-esbuild.XXXXXX")"
          vr180_native_build="$(mktemp -d "$RUNNER_TEMP/vr180-native-build.XXXXXX")"
          trap 'rm -rf "$vr180_native_prefix" "$vr180_native_build"' EXIT
          cp development/vr180/build-inputs/toolchain/package.json "$vr180_native_prefix/"
          cp development/vr180/build-inputs/toolchain/package-lock.json "$vr180_native_prefix/"
          npm ci --prefix "$vr180_native_prefix" --ignore-scripts --include=dev --include=optional --no-audit --no-fund
